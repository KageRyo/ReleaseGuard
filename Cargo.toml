[package]
name = "releaseguard"
version = "0.2.1"
edition = "2021"
description = "Validate dataset structure, relationships, temporal constraints, and integrity before release"
license = "Apache-2.0"
repository = "https://github.com/KageRyo/ReleaseGuard"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
